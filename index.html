<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oregon Scientific SHE101 Controller</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --accent: #38bdf8;
      --success: #34d399;
      --warn: #fbbf24;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    button {
      background: var(--accent);
      color: #0f172a;
      font-weight: bold;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover { filter: brightness(1.1); }
    button:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
    button.export { background: var(--success); }
    button.sync { background: var(--warn); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .card {
      background: var(--card);
      padding: 16px;
      border-radius: 8px;
      border: 1px solid #334155;
      text-align: center;
    }

    .card label {
      font-size: 0.75rem;
      color: #94a3b8;
      text-transform: uppercase;
      font-weight: 600;
    }

    .metric {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--success);
      margin-top: 6px;
    }

    #log {
      font-family: monospace;
      font-size: 0.8rem;
      color: var(--accent);
      white-space: pre-wrap;
      max-height: 250px;
      overflow-y: auto;
      background: #020617;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #334155;
    }
  </style>
</head>
<body>

  <h2>Oregon Scientific SHE101 Controller</h2>

  <div class="btn-group">
    <button id="connectBtn">Connect Device</button>
    <button id="rtcBtn" class="sync" disabled>Send Full Handshake</button>
    <button id="pollBtn" disabled>Force Real-Time Data Stream</button>
    <button id="exportBtn" class="export" disabled>Export CSV</button>
  </div>

  <div class="grid">
    <div class="card"><label>PM 1.0</label><div class="metric" id="pm10_val">-- µg/m³</div></div>
    <div class="card"><label>PM 2.5</label><div class="metric" id="pm25_val">-- µg/m³</div></div>
    <div class="card"><label>PM 10</label><div class="metric" id="pm100_val">-- µg/m³</div></div>
    <div class="card"><label>VOC</label><div class="metric" id="voc_val">--</div></div>
    <div class="card"><label>Humidity</label><div class="metric" id="hum_val">-- %</div></div>
    <div class="card"><label>Temperature</label><div class="metric" id="temp_val">-- °C</div></div>
  </div>

  <div class="card" style="margin-bottom: 20px;">
    <canvas id="chart" height="80"></canvas>
  </div>

  <div class="card">
    <div style="text-align: left; margin-bottom: 6px;"><strong>Connection & Protocol Stream:</strong></div>
    <div id="log">1. Plug into 5V wall power. 2. Press device button. 3. Click Connect Device.</div>
  </div>

  <script>
    const SERVICE_UUID = '74e7feaa-c6a4-11e2-b7a9-0002a5d5c51b';
    const NOTIFY_UUID  = '74e7aa05-c6a4-11e2-b7a9-0002a5d5c51b';
    const WRITE_UUID   = '74e7aa06-c6a4-11e2-b7a9-0002a5d5c51b';

    let writeChar = null;
    let notifyChar = null;
    let heartbeatTimer = null;
    let txLock = false; // Prevents GATT collisions
    const csvRecords = [];

    const historyData = { labels: [], pm25: [], voc: [], temp: [] };
    const chart = new Chart(document.getElementById('chart').getContext('2d'), {
      type: 'line',
      data: {
        labels: historyData.labels,
        datasets: [
          { label: 'PM 2.5 (µg/m³)', data: historyData.pm25, borderColor: '#f87171', fill: false, tension: 0.2 },
          { label: 'VOC', data: historyData.voc, borderColor: '#38bdf8', fill: false, tension: 0.2 },
          { label: 'Temp (°C)', data: historyData.temp, borderColor: '#34d399', fill: false, tension: 0.2 }
        ]
      },
      options: { responsive: true, scales: { y: { beginAtZero: true } } }
    });

    function getTimestamp() {
      const d = new Date();
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      const ss = String(d.getSeconds()).padStart(2, '0');
      const ms = String(d.getMilliseconds()).padStart(3, '0');
      return `[${hh}:${mm}:${ss}.${ms}]`;
    }

    function log(msg) {
      const l = document.getElementById('log');
      l.innerText += `\n${getTimestamp()} ${msg}`;
      l.scrollTop = l.scrollHeight;
    }

    // Helper function to convert standard numbers to Binary Coded Decimal (BCD)
    function toBCD(val) {
      return Math.floor(val / 10) * 16 + (val % 10);
    }

    // Transmission Queue system to prevent GATT Errors
    async function sendPacket(bytes) {
      if (!writeChar) return;
      
      // Wait in line if another packet is currently transmitting
      while (txLock) {
        await new Promise(resolve => setTimeout(resolve, 50));
      }
      
      txLock = true;
      const hex = bytes.map(b => '0x' + b.toString(16).padStart(2, '0')).join(', ');
      log(`--> Tx: [${hex}]`);
      
      try {
        await writeChar.writeValueWithResponse(new Uint8Array(bytes));
      } catch (e) {
        try {
          await writeChar.writeValueWithoutResponse(new Uint8Array(bytes));
        } catch (err) {
          log(`Tx Error: ${err.message}`);
        }
      } finally {
        txLock = false; // Release the lock
      }
    }

    async function executeFullHandshake() {
      log('--- Initializing 3-Step Handshake Sequence ---');
      const now = new Date();

      // Convert Current Time to BCD format
      const year = toBCD(now.getFullYear() % 100);
      const month = toBCD(now.getMonth() + 1);
      const day = toBCD(now.getDate());
      const hour = toBCD(now.getHours());
      const min = toBCD(now.getMinutes());
      const sec = toBCD(now.getSeconds());
      const dow = now.getDay() === 0 ? 7 : now.getDay();

      // 1. RTC Time Sync Packet
      const rtcPayload = [0x55, 0x0B, 0x10, year, month, day, hour, min, sec, dow];
      let chksum = 0;
      for (let i = 1; i < rtcPayload.length; i++) chksum += rtcPayload[i];
      rtcPayload.push(chksum & 0xFF);

      log('1/3: Transmitting RTC Time Sync...');
      await sendPacket(rtcPayload);
      await new Promise(r => setTimeout(r, 1000));

      // 2. Wake MCU / Open Session Packet
      log('2/3: Transmitting Wake Command...');
      await sendPacket([0x55, 0x04, 0x00, 0x00, 0x04]);
      await new Promise(r => setTimeout(r, 1000));

      // 3. Set Continuous Measurement Stream Mode
      log('3/3: Transmitting Mode Activation (Continuous Telemetry)...');
      await sendPacket([0x55, 0x05, 0x02, 0x01, 0x00, 0x08]);
    }

    function parseTelemetryBuffer(buffer) {
      const raw = new Uint8Array(buffer);
      const dataView = new DataView(buffer);
      const hex = Array.from(raw).map(b => b.toString(16).padStart(2, '0')).join(' ');
      
      log(`\n========================================`);
      log(`>>> TELEMETRY PACKET RECEIVED [${raw.length} bytes]: ${hex}`);
      log(`========================================\n`);

      if (raw.length >= 18) {
        const pm1_0 = dataView.getUint16(6, false);
        const pm2_5 = dataView.getUint16(8, false);
        const pm10  = dataView.getUint16(10, false);
        
        // VOC fix: 12 divided by 1000 = 0.012 (rounded to 0.01)
        const vocVal = dataView.getUint16(12, false);
        const voc = (vocVal / 1000.0).toFixed(2);
        
        const humVal = dataView.getUint16(14, false);
        const hum   = (humVal / 100.0).toFixed(1);
        
        const tempVal = dataView.getInt16(16, false);
        const temp = (tempVal / 100.0).toFixed(1);

        document.getElementById('pm10_val').innerText = `${pm1_0} µg/m³`;
        document.getElementById('pm25_val').innerText = `${pm2_5} µg/m³`;
        document.getElementById('pm100_val').innerText = `${pm10} µg/m³`;
        document.getElementById('voc_val').innerText = `${voc}`;
        document.getElementById('hum_val').innerText = `${hum} %`;
        document.getElementById('temp_val').innerText = `${temp} °C`;

        const timestamp = new Date().toISOString();
        csvRecords.push({ timestamp, pm1_0, pm2_5, pm10, voc, hum, temp });
        document.getElementById('exportBtn').disabled = false;

        const tsShort = new Date().toLocaleTimeString();
        historyData.labels.push(tsShort);
        historyData.pm25.push(pm2_5);
        historyData.voc.push(voc);
        historyData.temp.push(temp);

        if (historyData.labels.length > 25) {
          historyData.labels.shift();
          historyData.pm25.shift();
          historyData.voc.shift();
          historyData.temp.shift();
        }
        chart.update();
      }
    }

    function handleTelemetry(evt) {
      parseTelemetryBuffer(evt.target.value.buffer);
    }

    document.getElementById('connectBtn').addEventListener('click', async (e) => {
      e.target.disabled = true;
      try {
        log('Scanning for XSHE device...');
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ namePrefix: 'XSHE' }],
          optionalServices: [SERVICE_UUID]
        });

        log(`Connecting to ${device.name}...`);
        const server = await device.gatt.connect();

        log('Opening Service...');
        const service = await server.getPrimaryService(SERVICE_UUID);
        notifyChar = await service.getCharacteristic(NOTIFY_UUID);
        writeChar = await service.getCharacteristic(WRITE_UUID);

        log('Subscribing to notifications...');
        await notifyChar.startNotifications();
        notifyChar.addEventListener('characteristicvaluechanged', handleTelemetry);
        log('Notifications active.');

        await executeFullHandshake();

        document.getElementById('rtcBtn').disabled = false;
        document.getElementById('pollBtn').disabled = false;
        e.target.innerText = "Connected";

        if (heartbeatTimer) clearInterval(heartbeatTimer);
        heartbeatTimer = setInterval(async () => {
          await sendPacket([0x55, 0x04, 0x01, 0x00, 0x05]);
        }, 5000);

        log('Active 5-second session keep-alive loop initialized.');

      } catch (err) {
        log(`ERROR: ${err.message}`);
        e.target.disabled = false;
      }
    });

    document.getElementById('rtcBtn').addEventListener('click', async (e) => {
      e.target.disabled = true;
      await executeFullHandshake();
      e.target.disabled = false;
    });

    document.getElementById('pollBtn').addEventListener('click', async () => {
      log('Requesting immediate telemetry frame...');
      await sendPacket([0x55, 0x04, 0x01, 0x00, 0x05]);
    });

    document.getElementById('exportBtn').addEventListener('click', () => {
      if (csvRecords.length === 0) return;
      let csv = 'Timestamp,PM1.0 (ug/m3),PM2.5 (ug/m3),PM10 (ug/m3),VOC,Humidity (%),Temp (C)\n';
      csvRecords.forEach(r => {
        csv += `${r.timestamp},${r.pm1_0},${r.pm2_5},${r.pm10},${r.voc},${r.hum},${r.temp}\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `SHE101_Telemetry_${Date.now()}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
